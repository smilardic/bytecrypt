[build-system]
# setuptools 77 is the first release with PEP 639 license metadata.
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bytecrypt"
version = "1.0.0"
description = "Encrypt and decrypt data with a password"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stjepan Milardić" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
keywords = ["encrypt", "decrypt", "bytecrypt", "encryption", "decryption", "scrypt", "fernet"]

dependencies = [
    "cryptography",
]

# cryptography 48 ships a cp311 abi3 wheel, so 3.11 is the real floor.
requires-python = ">=3.11"

[project.scripts]
bytecrypt = "bytecrypt.__main__:main"

[project.urls]
Homepage = "https://github.com/smilardic/bytecrypt"
Repository = "https://github.com/smilardic/bytecrypt"
Issues = "https://github.com/smilardic/bytecrypt/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.yapf]
based_on_style = "facebook"