# This workflow publishes bytecrypt to PyPI after a published GitHub release.
# It uses PyPI Trusted Publishing with OIDC, thus it needs no API token and no
# PYPI_PASSWORD secret.
#
# Set this up one time on PyPI. Add a Trusted Publisher for this project. Point
# it at this repository and at the workflow file `python-publish.yml`. See
# https://docs.pypi.org/trusted-publishers/.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
