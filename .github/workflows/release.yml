# This workflow builds the standalone PyInstaller executables and attaches them
# to the GitHub release. The download links in the README point at the assets of
# the latest release.

name: Build executables

on:
  release:
    types: [published]

permissions:
  contents: write  # upload assets to the release

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: bytecrypt.exe
          - os: ubuntu-latest
            asset: bytecrypt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install package + pyinstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --name bytecrypt --console src/bytecrypt/__main__.py
      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/${{ matrix.asset }}
